[package]
name = "hymeko_graph"
version = "0.1.0"
edition = "2024"
description = "Generic signed-graph cycle and walk enumeration with axiomatic pruning. Cycle enumeration can structurally reject candidates that violate domain axioms (Friedler P-graph A1-A5, Cartwright-Harary balance, Davis weak balance, bipartite alternation) BEFORE materialising them."
license = "MIT OR Apache-2.0"
repository = "http://amaterasu.local:3000/hymeko/graph"
keywords = ["graph", "cycle", "signed-graph", "p-graph", "enumeration"]
categories = ["algorithms", "data-structures"]

[lib]
name = "hymeko_graph"

[dependencies]
rayon = "1.10"
dashmap = "6"

# No dev-dependencies. The tests here need nothing but the library, and the
# examples need nothing at all — so a checkout builds and tests with two
# crates behind it rather than a hundred and thirty.
#
# The benchmarks do need criterion and rand, so they live in `benchmarks/`
# as a separate crate with its own workspace root. Nothing is lost: run them
# with `cd benchmarks && cargo bench`. See that manifest for why.
