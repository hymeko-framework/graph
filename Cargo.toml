# hymeko/graph — graph analysis for HyMeKo.
#
# Two crates, laid out the way hymeko/core is:
#
#   hymeko_graph   signed-graph cycle and walk enumeration with axiomatic
#                  pruning. Standalone: rayon and dashmap, nothing else.
#   hymeko_pgraph  the P-graph framework — Material/Operating-Unit overlay on
#                  the HyMeKo IR, axiom checker, MSG/SSG generation, ABB
#                  solver. Needs the compiler, so it pulls hymeko_core.
#
# They do not depend on each other, which is worth knowing before reaching for
# either. `hymeko_graph::FriedlerAxiomPruner` encodes A0/A1/A3 as *cycle
# enumeration* pruning rules, cheap and structural; `hymeko_pgraph::axioms`
# checks A1–A5 against a real P-graph and can say why one failed. The first is
# a filter inside a search, the second is a verdict on a model.
#
# `benchmarks/` is deliberately not a member — it has its own workspace root so
# neither library resolves criterion. See that manifest.
[workspace]
resolver = "3"
members = ["hymeko_graph", "hymeko_pgraph", "hymeko_sbsh"]

[workspace.dependencies]
# The split-out HyMeKo repos. `hymeko_framework_rust` is retired; these are
# the live ones.
hymeko_core = { git = "ssh://git@192.168.1.228:2222/hymeko/core.git", rev = "c4715f3a0bb78133db88d41cfdfe991e5a184419" }
parser = { git = "ssh://git@192.168.1.228:2222/hymeko/parser.git", rev = "f11628591a8183586492807ecdf43c64e6d31c5f" }
