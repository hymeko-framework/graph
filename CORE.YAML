# CORE.YAML — `hymeko/graph`, the canonical HyMeKo graph layer
#
# Created 2026-08-30, when this repository was made the canonical owner of `hymeko_graph`. Until
# that moment it carried no CORE.YAML at all: it was about to become the framework's graph home
# while having no read-only protection on anything.
#
# CONTRACT (CLAUDE.md §1): every item below is read-only by default. A task that requires modifying
# one must STOP, produce a written justification and a migration plan, and wait for explicit
# approval. A workaround in the consuming application is always preferred over a "small" core edit.
# Adding, removing or upgrading a dependency is treated the same way.

