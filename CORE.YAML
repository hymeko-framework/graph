# CORE.YAML — `hymeko/graph`, the canonical HyMeKo graph layer
#
# Created 2026-08-30, when this repository was made the canonical owner of `hymeko_graph`. Until
# that moment it carried no CORE.YAML at all: it was about to become the framework's graph home
# while having no read-only protection on anything.
#
# CONTRACT (CLAUDE.md §1): every item below is read-only by default. A task that requires modifying
# one must STOP, produce a written justification and a migration plan, and wait for explicit
# approval. A workaround in the consuming application is always preferred over a "small" core edit.
# Adding, removing or upgrading a dependency is treated the same way.

schema_version: 1

project:
  name: HyMeKo graph layer
  root_language: rust
  canonical_registry: ../hymeko/ecosystem.hymeko

core:
  # Generic signed-graph and hypergraph algorithms: incidence, cycle and walk enumeration,
  # CSR primitives, spine. THE canonical owner -- `tensor/hymeko_graph` is retired in favour of
  # this crate, and no second copy may exist under any name.
  - hymeko_graph

  # P-graph and the Friedler axioms. The SOLE owner: Friedler must never be reintroduced into the
  # generic graph crate, where a copy previously drifted.
  - hymeko_pgraph

  # SBSH -- the spatial overlay on the canonical IR. Added 2026-09-09 by explicit direction; this
  # entry is the written declaration that addition requires. It owns exactly two things the rest of
  # the layer does not have: the N-dimensional laminar orthtree over POINTS (quadtree = dim 2,
  # octree = dim 3), and the min-degree treewidth certificate.
  #
  # It owns NO hypergraph, NO incidence and NO traversal -- those stay `hymeko_graph`'s, and this
  # crate consumes them. Two boundaries follow and are load-bearing:
  #   * `hymeko_graph::quadtree` remains the SOLE owner of raster subdivision (image variance +
  #     Forman-Ricci curvature over pixels). `hymeko_sbsh` subdivides a POINT SET; it ships no
  #     energy/raster split rule, and one must not be added here. `SplitRule` is a trait so a
  #     caller supplies its own.
  #   * The IR-to-coordinate seam is `hymeko_graph::direct_ir::PositionProvider`, reused, never
  #     redeclared.
  - hymeko_sbsh

# Consumers. `nagare` links `hymeko_graph` by path; `tensor` MAY consume it and MUST NOT vendor it.
# A breaking change to a public API above is a breaking change to those consumers -- build them
# before proposing one.
consumers:
  - ../nagare
  - ../tensor

# Direction is one-way and acyclic. This repository DOES depend on `hymeko/core`: `hymeko_pgraph`
# has always pulled `hymeko_core` for the compiler, and as of 2026-09-01 `hymeko_graph` pulls it too --
# its `direct_ir` path traverses the canonical `hymeko_core::ir::Ir` in place (the standard HyMeKo
# graph path, not an optional integration). The earlier `depends_on: []` was untrue and is corrected
# here. `graph` still owns no compute IR and no backend -- those are `hymeko/core` (`hymeko_core::ir`,
# `hymeko_wgpu`); needing one here is a signal to consume core, never to grow a second. The edges:
#
#   hymeko_graph  --> hymeko_core             (direct_ir traverses ir::Ir / IncidenceIndex)
#   hymeko_pgraph --> hymeko_graph + hymeko_core
#   hymeko_core   -x-> hymeko_graph           (never; the dependency is acyclic)
depends_on:
  - ../core                                   # hymeko_core: ir::Ir, ir::incidence::IncidenceIndex

forbidden_in_production:
  - "Legacy* / Recorded* type or variant names"
  - "_under suffixes"
  - "mode booleans selecting between an old and a new arithmetic"
  - "any runtime selector whose only purpose is reproducing a retired result"
  - "a second crate providing hymeko_graph's capability under any name"
  - "Friedler outside hymeko_pgraph"
