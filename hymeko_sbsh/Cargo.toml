[package]
name = "hymeko_sbsh"
version = "0.1.0"
edition = "2024"
description = "SBSH — Spatial Bounded-width Signed Hypergraph. An N-dimensional laminar orthtree over positioned IR declarations, supplying the spatial patch family the canonical signed-incidence IR does not carry, plus the min-degree treewidth certificate that predicts whether a bounded-width solve over it is cheap."
license = "MIT"

[lib]
name = "hymeko_sbsh"

[dependencies]
# The canonical signed-incidence hypergraph. SBSH is an OVERLAY on it: `Ir` supplies
# vertices, hyperarcs, the incidence operator and the +/-/~ signs; this crate adds only
# the spatial partition and the width certificate. It never builds a second hypergraph.
hymeko_core = { workspace = true }

# The generic graph layer. `PositionProvider` (the IR -> coordinate seam) and the
# incidence traversal live there and are REUSED, not restated -- `hymeko_graph` is the
# canonical owner of incidence and hypergraph algorithms (CORE.YAML), and this crate
# must not carry a second copy of either.
hymeko_graph = { path = "../hymeko_graph" }
