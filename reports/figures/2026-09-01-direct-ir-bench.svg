<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" font-family="sans-serif" font-size="13">
  <rect width="760" height="420" fill="white"/>
  <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold">direct-Ir reachability: warm query time (us, nnz~1e6, median-of-9)</text>
  <text x="380" y="42" text-anchor="middle" fill="#555">A=direct(node+arc)  B=direct(no arc-visited)  C=sparse-star O(nnz)  D=clique O(Sum k^2) — lower is faster</text>

  <!-- axes -->
  <line x1="70" y1="360" x2="720" y2="360" stroke="#333"/>
  <line x1="70" y1="70" x2="70" y2="360" stroke="#333"/>
  <!-- y gridlines: 0..15000 us, 300px tall -> 20 us/px -->
  <g fill="#777" font-size="11">
    <line x1="70" y1="360" x2="720" y2="360" stroke="#eee"/>
    <line x1="70" y1="300" x2="720" y2="300" stroke="#eee"/><text x="64" y="304" text-anchor="end">3000</text>
    <line x1="70" y1="240" x2="720" y2="240" stroke="#eee"/><text x="64" y="244" text-anchor="end">6000</text>
    <line x1="70" y1="180" x2="720" y2="180" stroke="#eee"/><text x="64" y="184" text-anchor="end">9000</text>
    <line x1="70" y1="120" x2="720" y2="120" stroke="#eee"/><text x="64" y="124" text-anchor="end">12000</text>
    <line x1="70" y1="60"  x2="720" y2="60"  stroke="#eee"/><text x="64" y="64"  text-anchor="end">15000</text>
    <text x="64" y="364" text-anchor="end">0</text>
  </g>

  <!-- arity 5 group (scale: 300px = 15000us -> 0.02 px/us) -->
  <!-- A=14063 -> h=281.3 ; B=13832 -> 276.6 ; C=1045 -> 20.9 ; D=660 -> 13.2 -->
  <g>
    <rect x="120" y="78.7"  width="46" height="281.3" fill="#2b6cb0"/>
    <rect x="170" y="83.4"  width="46" height="276.6" fill="#63b3ed"/>
    <rect x="220" y="339.1" width="46" height="20.9"  fill="#dd6b20"/>
    <rect x="270" y="346.8" width="46" height="13.2"  fill="#e53e3e"/>
    <text x="220" y="388" text-anchor="middle" font-weight="bold">arity 5</text>
    <text x="143" y="74" text-anchor="middle" font-size="10">A 14063</text>
    <text x="193" y="79" text-anchor="middle" font-size="10">B 13832</text>
    <text x="243" y="334" text-anchor="middle" font-size="10">C 1045</text>
    <text x="293" y="342" text-anchor="middle" font-size="10">D 660</text>
  </g>

  <!-- arity 20 group -->
  <!-- A=10129 -> 202.6 ; B=12620 -> 252.4 ; C=649 -> 13.0 ; D=512 -> 10.2 -->
  <g>
    <rect x="460" y="157.4" width="46" height="202.6" fill="#2b6cb0"/>
    <rect x="510" y="107.6" width="46" height="252.4" fill="#63b3ed"/>
    <rect x="560" y="347.0" width="46" height="13.0"  fill="#dd6b20"/>
    <rect x="610" y="349.8" width="46" height="10.2"  fill="#e53e3e"/>
    <text x="560" y="388" text-anchor="middle" font-weight="bold">arity 20</text>
    <text x="483" y="153" text-anchor="middle" font-size="10">A 10129</text>
    <text x="533" y="103" text-anchor="middle" font-size="10">B 12620</text>
    <text x="583" y="342" text-anchor="middle" font-size="10">C 649</text>
    <text x="633" y="345" text-anchor="middle" font-size="10">D 512</text>
  </g>

  <text x="380" y="410" text-anchor="middle" fill="#555" font-size="11">
    Honest: A ~= B (visited-arc removes k^2, but A's fat-canonical-struct constant factor dominates) => A is ~13-15x slower than the flat-u32 star CSR (C). Direct beats clique on build (4.3x-9x).
  </text>
</svg>
