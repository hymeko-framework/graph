<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" font-family="sans-serif" font-size="13">
  <rect width="720" height="380" fill="white"/>
  <text x="360" y="22" text-anchor="middle" font-size="16" font-weight="bold">Direct-Ir op survey (arity 5, nnz=5e5): warm ns / incidence</text>
  <text x="360" y="40" text-anchor="middle" fill="#555">walk ops cluster ~13–17 ns/inc (fat-structure cache cost); s-connected-components is ~5× cheaper (union-find)</text>
  <line x1="70" y1="330" x2="700" y2="330" stroke="#333"/>
  <line x1="70" y1="60" x2="70" y2="330" stroke="#333"/>
  <g fill="#777" font-size="11">
    <line x1="70" y1="262" x2="700" y2="262" stroke="#eee"/><text x="64" y="266" text-anchor="end">5</text>
    <line x1="70" y1="194" x2="700" y2="194" stroke="#eee"/><text x="64" y="198" text-anchor="end">10</text>
    <line x1="70" y1="126" x2="700" y2="126" stroke="#eee"/><text x="64" y="130" text-anchor="end">15</text>
    <line x1="70" y1="60"  x2="700" y2="60"  stroke="#eee"/><text x="64" y="64"  text-anchor="end">20 ns/inc</text>
    <text x="64" y="334" text-anchor="end">0</text>
  </g>
  <!-- scale: 270px = 20 ns -> 13.5 px/ns. bars from y=330 up -->
  <!-- reachable 13.4->180.9h; berge 16.7->225.5h; components 14.4->194.4h; dual 13.3->179.6h; s-cc 2.7->36.5h -->
  <g>
    <rect x="110" y="149.1" width="70" height="180.9" fill="#2b6cb0"/><text x="145" y="144" text-anchor="middle" font-size="10">13.4</text>
    <rect x="230" y="104.5" width="70" height="225.5" fill="#3182ce"/><text x="265" y="99" text-anchor="middle" font-size="10">16.7</text>
    <rect x="350" y="135.6" width="70" height="194.4" fill="#4299e1"/><text x="385" y="130" text-anchor="middle" font-size="10">14.4</text>
    <rect x="470" y="150.4" width="70" height="179.6" fill="#63b3ed"/><text x="505" y="145" text-anchor="middle" font-size="10">13.3</text>
    <rect x="590" y="293.5" width="70" height="36.5" fill="#dd6b20"/><text x="625" y="288" text-anchor="middle" font-size="10">2.7</text>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="145" y="348">reachable</text>
    <text x="265" y="348">berge_path</text>
    <text x="385" y="348">components</text>
    <text x="505" y="348">dual</text>
    <text x="625" y="348">s-cc(1)</text>
  </g>
  <text x="360" y="372" text-anchor="middle" fill="#555" font-size="11">Rayon batch scales 2.8×→10.8× (1e4→1e5). PROVISIONAL (ambient ~14%).</text>
</svg>
