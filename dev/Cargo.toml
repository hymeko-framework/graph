[package]
name = "hymeko-graph-dev"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false
autobenches = false
autoexamples = false
description = "Existing Graph correctness clients linked through a shared Rust library"

[dependencies]
hymeko_graph = { package = "hymeko-graph-dylib", path = "dylib" }
hymeko_core = { workspace = true }

[dev-dependencies]
rayon = "1.10"

