# The benchmarks, as their own crate.
#
# `[workspace]` with nothing in it makes this an independent workspace root,
# so the library above never resolves criterion or rand. That matters more
# than it sounds: criterion's dependency closure is a hundred and twenty-odd
# crates including a wasm-bindgen toolchain, and requiring all of it to run
# `cargo test` on a graph library is the wrong trade. Here it is opt-in.
#
#     cd benchmarks && cargo bench
#
# Needs crates.io. The HyMeKo build machines reach it through a vendored
# registry that deliberately does not carry the benchmarking tree.
[workspace]

[package]
name = "hymeko_graph_benchmarks"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
hymeko_graph = { path = "../hymeko_graph" }
hymeko_pgraph = { path = "../hymeko_pgraph" }
parser = { git = "ssh://git@192.168.1.228:2222/hymeko/parser.git", rev = "f11628591a8183586492807ecdf43c64e6d31c5f" }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.9"
# search_bench builds its IR workloads with Core, at the graph workspace's revision, so the tree holds
# one Core identity.
hymeko_core = { git = "ssh://git@192.168.1.228:2222/hymeko/core.git", rev = "9f533ca8f9cd39806d8db9a0a68cda7932c81ae2" }
# The conventional adjacency-list graph search that search_bench sets against the Berge search. It is
# already in this tree through lalrpop.
petgraph = "0.8"

[[bench]]
name = "graph_bench"
harness = false

[[bench]]
name = "spine_bench"
harness = false

[[bench]]
name = "incidence_bench"
harness = false

# `pgraph_bench` reads its fixtures with `include_str!("../../data/...")`.
# That resolved to the repo root from `hymeko_pgraph/benches/` and still does
# from here, so the source needed no change when it moved.
[[bench]]
name = "pgraph_bench"
harness = false

# The Berge search against petgraph on the informed bench's workloads, which it reads with
# `#[path]` from `hymeko_graph/tests/informed_common/`.
[[bench]]
name = "search_bench"
harness = false
